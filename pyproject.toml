[project]
name = "rcn-docproc"
version = "0.1.0"
description = "Narrow AI document processing project (no OCR)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Default runs the fast FUNCTIONAL suite (no model/artifact needed).
# Model-dependent tests run separately: pytest -m model
addopts = "-m 'not model'"
markers = [
    "model: needs real model/artifacts (SVM joblib, keras CNN, summarizer checkpoint) — run via pytest -m model",
]

[tool.ruff.lint]
# Broad excepts are intentional across the pipeline: advisory router,
# per-file CLI skips, config/artifact fallbacks (spec D2/D3).
ignore = ["BLE001"]
[project]
name = "rcn-docproc"
version = "0.1.0"
description = "Narrow AI document processing project (no OCR)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Mặc định chạy bài FUNCTIONAL nhanh (không cần model/artifact).
# Bài model-dependent chạy riêng: pytest -m model
addopts = "-m 'not model'"
markers = [
    "model: cần model/artifact thật (SVM joblib, keras CNN, checkpoint tóm tắt) — chạy riêng: pytest -m model",
]

[tool.ruff.lint]
# Broad excepts are intentional across the pipeline: advisory router,
# per-file CLI skips, config/artifact fallbacks (spec D2/D3).
ignore = ["BLE001"]
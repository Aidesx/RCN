vectorizer:
  tfidf:
    max_features: 10000
    ngram_range: [1, 2]
    sublinear_tf: true
    stop_words: english
models:
  svm:
    class: linear_svc
    param_grid:
      C: [0.1, 1.0, 10.0]
  random_forest:
    class: random_forest
    param_grid:
      n_estimators: [100, 200]
      max_depth: [10, 20, null]
cross_validation:
  folds: 5
  scoring: f1_macro
  seed: 42
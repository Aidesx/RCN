
invoice:
  required: [invoice_number, total_due]
  fields:
    invoice_number:
      patterns:
        - '(?:INVOICE|Invoice)\s*(?:#|number|#\s*|No\.?[:\\s]*)\s*([A-Z]{0,5}-?\d+(?:-\d+)*)'
        - '#(INV-\d+)'
      normalize: upper
    date:
      patterns:
        - 'Date:\s*(\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/\d{2,4})'
        - 'issue[d]?\s*(?:date)?[:\\s]*(\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/\d{2,4})'
      normalize: date
    total_due:
      patterns:
        - '(?:TOTAL DUE|Total due|Total)\s*:?\s*\$?\s*((?:\$|USD\s*)?\d[\d,]*(?:\.\d{1,2})?)'
      normalize: money
    vendor:
      patterns:
        - 'From:\s*(.+)'
        - 'issued by\s+(.+?)\.'
    buyer:
      patterns:
        - '(?:Bill to|Billed to|Customer)[:\s]*\n?\s*(.+)'
        - 'purchased by\s+(.+?)\b'

receipt:
  required: [total]
